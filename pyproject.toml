[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "test-blueprint-builder"
version = "0.1.0"
description = "Proportional, reproducible test blueprints with alignment checks."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "pyyaml>=6", "scipy>=1.10", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
blueprint = "blueprint.cli:main"

[tool.setuptools]
packages = ["blueprint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
